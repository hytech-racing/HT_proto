syntax = "proto3";
package dv_msgs;
import "base_msgs.proto";

/**
 * Driverless cones proto message. Primarily used to package ground-truth cone positions from the simulator to Drivebrain itself.
*/
message Cones {
  enum ConeColor { UNKNOWN = 0; BLUE = 1; YELLOW = 2; ORANGE_SMALL = 3; ORANGE_BIG = 4 ; }
  message Cone { hytech_msgs.xyz_vector position = 1; ConeColor color = 2; }
  repeated Cone cones = 1;
  uint64 timestamp_us = 2;
}

message SimulationGroundTruth {
  uint64 timestamp_ns = 1;

  double x_world_m = 2;
  double y_world_m = 3;
  double yaw_world_rad = 4;

  double vx_world_mps = 5;
  double vy_world_mps = 6;
  double yaw_rate_radps = 7;

  double ax_world_mps2 = 8;
  double ay_world_mps2 = 9;
  double yaw_accel_radps2 = 10;
}

message DriverlessStateEstimate {
  uint64 timestamp_ns = 1;
  bool initialized = 2;

  double x_odom_m = 3;
  double y_odom_m = 4;
  double yaw_odom_rad = 5;

  double vx_vehicle_flu_mps = 6;
  double vy_vehicle_flu_mps = 7;
  double yaw_rate_vehicle_flu_radps = 8;
}

message LidarProcessingDebug {
  uint64 timestamp_ns = 1;

  uint32 input_points = 2;
  uint32 deskewed_points = 3;
  uint32 filtered_points = 4;
  uint32 ground_points = 5;
  uint32 non_ground_points = 6;

  GroundRemovalDebug ground_removal = 10;
  ClusteringDebug clustering = 11;
  ConeFilterDebug cone_filter = 12;
}

message GroundRemovalDebug {
  uint32 input_points = 1;
  uint32 ground_points = 2;
  uint32 non_ground_points = 3;
  uint32 valid_cells = 4;
  uint32 invalid_cells = 5;
}

message ClusteringDebug {
  uint32 input_points = 1;
  uint32 raw_cluster_count = 2;
  uint32 accepted_cluster_count = 3;
  uint32 rejected_too_small = 4;
  uint32 rejected_too_large = 5;
}

message ConeFilterDebug {
  uint32 input_clusters = 1;
  uint32 accepted_candidates = 2;
  uint32 rejected_clusters = 3;

  uint32 rejected_too_far = 10;
  uint32 rejected_too_few_points = 11;
  uint32 rejected_too_short = 12;
  uint32 rejected_too_tall = 13;
  uint32 rejected_too_wide = 14;
  uint32 rejected_too_elongated = 15;
}
