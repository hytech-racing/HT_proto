syntax = "proto3";
package dv_msgs;
import "base_msgs.proto";

/**
 * Driverless cones proto message. Primarily used to package ground-truth cone positions from the simulator to Drivebrain itself.
*/
message Cones {
  enum ConeColor { UNKNOWN = 0; BLUE = 1; YELLOW = 2; ORANGE_SMALL = 3; ORANGE_BIG = 4 ; }
  message Cone { hytech_msgs.xyz_vector position = 1; ConeColor color = 2; }
  repeated Cone cones = 1;
  uint64 timestamp_us = 2;
}

message SimulationGroundTruth {
  uint64 timestamp_ns = 1;

  double x_world_m = 2;
  double y_world_m = 3;
  double yaw_world_rad = 4;

  double vx_world_mps = 5;
  double vy_world_mps = 6;
  double yaw_rate_radps = 7;

  double ax_world_mps2 = 8;
  double ay_world_mps2 = 9;
  double yaw_accel_radps2 = 10;
}

message DriverlessStateEstimate {
  uint64 timestamp_ns = 1;
  bool initialized = 2;

  double x_odom_m = 3;
  double y_odom_m = 4;
  double yaw_odom_rad = 5;

  double vx_vehicle_flu_mps = 6;
  double vy_vehicle_flu_mps = 7;
  double yaw_rate_vehicle_flu_radps = 8;
}

message LidarProcessingDebug {
  uint64 timestamp_ns = 1;

  uint32 input_points = 2;
  uint32 deskewed_points = 3;
  uint32 filtered_points = 4;
  uint32 ground_points = 5;
  uint32 non_ground_points = 6;

  GroundRemovalDebug ground_removal = 10;
  ClusteringDebug clustering = 11;
  ConeFilterDebug cone_filter = 12;
}

message GroundRemovalDebug {
  uint32 input_points = 1;
  uint32 ground_points = 2;
  uint32 non_ground_points = 3;
  uint32 valid_cells = 4;
  uint32 invalid_cells = 5;
}

message ClusteringDebug {
  uint32 input_points = 1;
  uint32 raw_cluster_count = 2;
  uint32 accepted_cluster_count = 3;
  uint32 rejected_too_small = 4;
  uint32 rejected_too_large = 5;
}

message ConeFilterDebug {
  uint32 input_clusters = 1;
  uint32 accepted_candidates = 2;
  uint32 rejected_clusters = 3;

  uint32 rejected_too_far = 10;
  uint32 rejected_too_few_points = 11;
  uint32 rejected_too_short = 12;
  uint32 rejected_too_tall = 13;
  uint32 rejected_too_wide = 14;
  uint32 rejected_too_elongated = 15;
}

message SlamFrontendDebug {
  int64 timestamp_ns = 1;
  bool frame_accepted = 2;
  string message = 3;

  uint32 landmark_observations = 4;
  repeated uint64 new_landmark_ids = 5;

  SlamFrontendDiagnostics diagnostics = 10;
}

message SlamFrontendDiagnostics {
  uint32 detections_received = 1;
  uint32 detections_rejected_invalid = 2;

  uint32 optimized_associations = 3;
  uint32 pending_associations = 4;
  uint32 tentative_associations = 5;

  uint32 tentative_tracks_created = 6;
  uint32 tracks_promoted = 7;
  uint32 tracks_removed_stale = 8;

  uint32 unmatched_detection_count = 9;
}

message SlamFrontendRunnerDebug {
  int64 timestamp_ns = 1;

  uint32 point_clouds_enqueued = 2;
  uint32 point_clouds_processed = 3;
  uint32 nonincreasing_point_clouds = 4;
  uint32 queue_trims = 5;
  uint32 current_queue_depth = 6;
  uint32 maximum_queue_depth = 7;
  int64 latest_point_cloud_timestamp_ns = 8;
  uint32 point_clouds_processing_failed = 9;

  uint32 map_state_update_success = 20;
  uint32 map_state_update_failed = 21;
  string map_state_message = 22;
  uint32 map_state_landmark_count = 23;
  uint32 map_state_pending_tracks_resolved = 24;
}

message IncrementalGraphSlamDebug {
  int64 timestamp_ns = 1;
  uint64 frame_index = 2;

  bool frame_accepted = 3;
  bool update_success = 4;
  bool core_failed = 5;
  string message = 6;

  IncrementalGraphSlamUpdateCounts update = 10;
  IncrementalGraphSlamTotals cumulative = 11;
  Isam2UpdateDiagnostics isam2 = 12;

  bool has_current_pose = 20;
  uint32 pose_index = 21;
  double recorded_pose_odom_x_m = 22;
  double recorded_pose_odom_y_m = 23;
  double recorded_pose_odom_yaw_rad = 24;
  double initial_pose_map_x_m = 25;
  double initial_pose_map_y_m = 26;
  double initial_pose_map_yaw_rad = 27;
  double optimized_pose_map_x_m = 28;
  double optimized_pose_map_y_m = 29;
  double optimized_pose_map_yaw_rad = 30;
  double pose_map_from_odom_x_m = 31;
  double pose_map_from_odom_y_m = 32;
  double pose_map_from_odom_yaw_rad = 33;
}

message IncrementalGraphSlamUpdateCounts {
  uint32 observations_received = 1;
  uint32 observations_admitted = 2;
  SlamObservationRejectionCounts observations_rejected = 3;

  uint32 new_landmarks_added = 4;
  uint32 new_values_added = 5;

  uint32 prior_factors_added = 6;
  uint32 between_factors_added = 7;
  uint32 measurement_factors_added = 8;
}

message IncrementalGraphSlamTotals {
  uint32 pose_count = 1;
  uint32 landmark_count = 2;

  uint32 prior_factor_count = 3;
  uint32 between_factor_count = 4;
  uint32 measurement_factor_count = 5;

  uint32 admitted_observation_count = 6;
  SlamObservationRejectionCounts rejected_observations = 7;
}

message SlamObservationRejectionCounts {
  uint32 unconfirmed_landmark_id = 1;
  uint32 nonfinite_measurement = 2;
  uint32 outside_measurement_range = 3;
  uint32 duplicate_landmark_id = 4;
}

message Isam2UpdateDiagnostics {
  bool has_error_before_update = 1;
  double error_before_update = 2;
  bool has_error_after_update = 3;
  double error_after_update = 4;
  uint32 variables_relinearized = 5;
  uint32 variables_reeliminated = 6;
}

message SlamBackendRunnerDebug {
  int64 timestamp_ns = 1;

  uint32 landmark_frames_enqueued = 2;
  uint32 landmark_frames_processed = 3;
  uint32 frames_rejected_not_running = 4;
  uint32 nonincreasing_landmark_frames = 5;
  uint32 queue_overflows = 6;
  uint32 current_queue_depth = 7;
  uint32 maximum_queue_depth = 8;
  int64 latest_landmark_frame_timestamp_ns = 9;
  uint32 landmark_frames_processing_failed = 10;
}

/**
 * One VelocityPlanner::step_controller tick: the spline fit over the path points ahead, their
 * curvature-limited velocities, every change made by the forward/backward passes, and the
 * resulting accel and torque request. Replaying changes over path_points gives the final profile.
 * Points and vectors are map frame, packed in xyz_vector with z = 0.
*/
message VelocityPlannerDebug {
  enum Status {
    UNKNOWN = 0;
    OK = 1;
    INVALID_HEADING = 2;
    EMPTY_PATH = 3;
    NEGATIVE_LONGITUDINAL_VELOCITY = 4;
    NO_FORWARD_POINT = 5;
    STALE_PATH = 6;
    SPLINE_TOO_FEW_POINTS = 7;
    PATH_POINTS_TOO_CLOSE = 8;
    SMALL_SPLINE_TANGENT = 9; // failing point index is path_points size
    CAR_TOO_CLOSE_TO_FIRST_POINT = 10;
  }

  uint64 timestamp_ns = 1;
  uint64 iteration = 2;
  Status status = 3;

  float mu = 4;
  float max_car_velocity_mps = 5;

  hytech_msgs.xyz_vector car_position_m = 6;
  hytech_msgs.xyz_vector car_heading = 7;
  hytech_msgs.xyz_vector car_velocity_raw_mps = 8;
  optional float longitudinal_velocity_mps = 9;

  VelocityPlannerSpline spline = 10;
  repeated VelocityPlannerPathPoint path_points = 11; // velocity is the curvature limit, before the passes
  repeated VelocityPlannerChange changes = 12;

  optional float target_velocity_mps = 13;
  optional float accel_mps2 = 14;
  optional float torque_per_wheel_nm = 15;
}

/* Natural cubic spline over the path points, parameterized by cumulative chord length (m) */
message VelocityPlannerSpline {
  /* c0..c3, p(u) = c0 + c1 u + c2 u^2 + c3 u^3 with u in [0, 1] between path_points i and i + 1 */
  message Segment { repeated hytech_msgs.xyz_vector coefficients = 1; }

  repeated Segment segments = 1;
}

message VelocityPlannerPathPoint {
  hytech_msgs.xyz_vector position_m = 1;
  float curvature = 2; // signed, 1/m
  float velocity_mps = 3;
}

message VelocityPlannerChange {
  enum Pass { UNKNOWN = 0; FORWARD = 1; BACKWARD = 2; }

  Pass pass = 1;
  uint32 index = 2; // into path_points
  bool changed = 3;
  float new_velocity_mps = 4;

  float curvature = 5; // of the segment's start point, 1/m
  float lateral_accel_mps2 = 6;
  float longitudinal_accel_available_mps2 = 7;
  float velocity_allowed_by_accel_mps = 8;
  bool lateral_accel_exceeded = 9;
}

/* One PurePursuitController::step_controller tick. target_point_m is unset when the lookahead circle doesn't meet the path. */
message PurePursuitDebug {
  uint64 timestamp_ns = 1;
  float lookahead_distance_m = 2; // radius of the lookahead circle around the car
  hytech_msgs.xyz_vector target_point_m = 3; // map frame, z = 0
  float curvature = 4; // signed, 1/m, of the arc from the car to the target point
  float yaw_rad = 5; // front-wheel steering angle from the bicycle model
  float column_angle_deg = 6;
}
